<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>4 Artículos para volverte productivo · Jimmy Rodríguez</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet"/>
  <style>
    @font-face {
      font-family: 'Outfit';
      src: url('fonts/Outfit-VariableFont_wght.ttf') format('truetype');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --yellow: #efdd3a;
      --dark:   #282828;
      --green:  #0c754f;
      --bg:     #faf8f0;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--dark);
    }

    .bg-blobs { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.5; }
    .blob-1 { width: 500px; height: 500px; background: var(--yellow); top: -120px; left: -120px; }
    .blob-2 { width: 400px; height: 400px; background: #b8e8a0; bottom: -80px; right: -80px; }

    nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.2rem 2rem; position: relative; z-index: 10;
    }
    .nav-logo { width: 40px; height: 40px; border-radius: 50%; overflow: hidden; }
    .nav-logo img { width: 100%; height: 100%; object-fit: cover; }
    .nav-back { font-size: 0.78rem; font-weight: 500; color: var(--dark); opacity: 0.45; text-decoration: none; letter-spacing: 0.04em; }
    .nav-back:hover { opacity: 0.8; }

    .wrapper { max-width: 680px; margin: 0 auto; padding: 3rem 1.5rem 6rem; position: relative; z-index: 1; }

    .tag {
      display: inline-block; font-size: 0.65rem; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase;
      background: var(--dark); color: var(--yellow);
      border-radius: 99px; padding: 0.25rem 0.85rem;
      margin-bottom: 1.2rem;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 6vw, 3.4rem);
      font-weight: 900; line-height: 1.08;
      color: var(--dark); margin-bottom: 1rem;
    }

    .sub { font-size: 0.9rem; opacity: 0.45; line-height: 1.7; max-width: 480px; margin-bottom: 3rem; }

    .articulos { display: flex; flex-direction: column; gap: 0.85rem; }

    .articulo {
      background: rgba(255,255,255,0.65);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.9);
      border-radius: 18px; padding: 1.4rem 1.6rem;
      display: flex; align-items: center; justify-content: space-between; gap: 1.2rem;
      box-shadow: 0 2px 16px rgba(0,0,0,0.05);
      text-decoration: none; color: var(--dark);
      transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
    }

    .articulo:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 28px rgba(0,0,0,0.09);
      background: rgba(255,255,255,0.88);
    }

    .articulo.coming { pointer-events: none; opacity: 0.35; }

    .articulo-left { display: flex; align-items: center; gap: 1.1rem; flex: 1; min-width: 0; }

    .articulo-num {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem; font-weight: 900;
      color: var(--dark); opacity: 0.12;
      line-height: 1; flex-shrink: 0; width: 1.8rem; text-align: center;
    }

    .articulo-body { flex: 1; min-width: 0; }

    .articulo-autor {
      font-size: 0.68rem; font-weight: 600;
      letter-spacing: 0.1em; text-transform: uppercase;
      opacity: 0.4; margin-bottom: 0.25rem;
    }

    .articulo-titulo {
      font-family: 'Playfair Display', serif;
      font-size: 1rem; font-weight: 700;
      color: var(--dark); line-height: 1.3;
    }

    .articulo-titulo.coming-text {
      font-style: italic; opacity: 0.4; font-family: 'Outfit', sans-serif; font-weight: 400;
    }

    .btn-abrir {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--dark); color: var(--yellow);
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; flex-shrink: 0;
      transition: transform 0.2s;
    }
    .articulo:hover .btn-abrir { transform: scale(1.1) rotate(-45deg); }

    .btn-coming {
      width: 40px; height: 40px; border-radius: 50%;
      border: 1.5px dashed rgba(0,0,0,0.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.65rem; flex-shrink: 0; opacity: 0.4;
    }

    @media (max-width: 500px) {
      .wrapper { padding: 2rem 1.2rem 5rem; }
      .articulo { padding: 1.1rem 1.2rem; }
    }
  </style>
</head>
<body>

<div class="bg-blobs">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
</div>

<nav>
  <a class="nav-logo" href="index.html"><img src="isotipo-recurso.jpeg" alt="Jimmy Rodríguez"/></a>
  <a class="nav-back" href="index.html">← Volver a recursos</a>
</nav>

<div class="wrapper">

  <span class="tag">Lectura</span>
  <h1>4 artículos para volverte jodidamente productivo.</h1>
  <p class="sub">Cuatro lecturas que cambian cómo piensas sobre tu tiempo, tu energía y tu vida.</p>

  <div class="articulos">

    <a href="https://letters.thedankoe.com/p/how-to-fix-your-entire-life-in-1" target="_blank" class="articulo">
      <div class="articulo-left">
        <div class="articulo-num">1</div>
        <div class="articulo-body">
          <div class="articulo-autor">Dan Koe</div>
          <div class="articulo-titulo">How to fix your entire life in 1 day</div>
        </div>
      </div>
      <div class="btn-abrir">↗</div>
    </a>

    <a href="https://www.sahilbloom.com/newsletter/the-annual-planning-guide" target="_blank" class="articulo">
      <div class="articulo-left">
        <div class="articulo-num">2</div>
        <div class="articulo-body">
          <div class="articulo-autor">Sahil Bloom</div>
          <div class="articulo-titulo">The Annual Planning Guide</div>
        </div>
      </div>
      <div class="btn-abrir">↗</div>
    </a>

    <div class="articulo coming">
      <div class="articulo-left">
        <div class="articulo-num">3</div>
        <div class="articulo-body">
          <div class="articulo-titulo coming-text">Próximamente...</div>
        </div>
      </div>
      <div class="btn-coming">···</div>
    </div>

    <div class="articulo coming">
      <div class="articulo-left">
        <div class="articulo-num">4</div>
        <div class="articulo-body">
          <div class="articulo-titulo coming-text">Próximamente...</div>
        </div>
      </div>
      <div class="btn-coming">···</div>
    </div>

  </div>

</div>

</body>
</html>
